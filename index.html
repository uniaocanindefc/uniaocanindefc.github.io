<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7A2531"><meta name="description" content="Site oficial do União Canindé F.C.">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="União Canindé">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>União Canindé F.C.</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style id="css">
/* Layout: arquibancada à noite — faixa de placar no topo, abas de estádio, conteúdo em blocos estreitos */
:root{
  --bg:#0C0D13; --surface:#15161F; --surface-2:#1D1E29; --line:#2C2D3B;
  --fg:#F1EEE8; --muted:#A3A6B3; --vinho:#7A2531; --vinho-2:#9A3040;
  --ouro:#D9A22E; --ouro-fg:#1A1206; --prata:#C7CBD2;
  --win:#3FA26B; --draw:#B9A15A; --loss:#C2484F;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F6F2EE; --surface:#FFFFFF; --surface-2:#F0E9E4; --line:#E0D5CF;
  --fg:#1B1316; --muted:#6C5F64; --vinho:#7A2531; --vinho-2:#8E2C3A;
  --ouro:#B9821A; --ouro-fg:#FFFFFF; --prata:#5E636D; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F6F2EE; --surface:#FFFFFF; --surface-2:#F0E9E4; --line:#E0D5CF;
  --fg:#1B1316; --muted:#6C5F64; --vinho:#7A2531; --vinho-2:#8E2C3A;
  --ouro:#B9821A; --ouro-fg:#FFFFFF; --prata:#5E636D; color-scheme:light}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--vinho)}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.02;letter-spacing:.01em}
.eyebrow{font-family:var(--f-num);text-transform:uppercase;letter-spacing:.14em;font-size:13px;color:var(--ouro);font-weight:600}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ouro);outline-offset:2px}

/* topo */
.hero{background:linear-gradient(160deg,var(--vinho) 0%,#4A1520 70%);color:#F6EFE3;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(255,255,255,.035) 46px 92px);pointer-events:none}
.hero .wrap{position:relative;z-index:1;padding-block:20px 22px;display:grid;gap:18px}
.brand{display:flex;align-items:center;gap:14px}
.crest{width:76px;height:auto;flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}
.brand h1{font-size:clamp(30px,8vw,52px);font-weight:900;text-transform:uppercase;color:#FFF7EA}
.brand .tag{font-family:var(--f-num);color:#E8C77A;letter-spacing:.08em;text-transform:uppercase;font-size:13px}
.slogan{font-size:15px;color:#EADBD0;max-width:60ch;margin:0}
.board{background:rgba(8,6,10,.55);border:1px solid rgba(217,162,46,.45);border-radius:6px;padding:14px;display:grid;gap:10px}
.board .row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.team{font-family:var(--f-display);font-weight:800;font-size:clamp(18px,5vw,28px);text-transform:uppercase;line-height:1.05;min-width:0;overflow-wrap:anywhere}
.team.r{text-align:right}
.vs{font-family:var(--f-num);color:#E8C77A;font-size:15px;letter-spacing:.1em}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:#E3D3C6}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.count div{background:rgba(255,255,255,.06);border-radius:4px;text-align:center;padding:6px 0}
.count b{display:block;font-family:var(--f-num);font-size:28px;color:#FFE3A1;line-height:1}
.count span{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#D5C2B6}

/* abas */
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs .wrap::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;background:none;border:0;padding:13px 12px 11px;font-family:var(--f-num);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--ouro)}

main .wrap{padding-block:22px 60px;display:grid;gap:28px}
section{display:grid;gap:14px}
section h2{font-size:30px;font-weight:800;text-transform:uppercase}
.sub{color:var(--muted);margin:0;max-width:62ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:12px}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid2>*{min-width:0}

/* jogos */
.match{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.match:last-child{border-bottom:0}
.match .d{font-family:var(--f-num);font-size:14px;color:var(--muted);line-height:1.15}
.match .t{min-width:0;font-weight:600;overflow-wrap:anywhere}
.match .t small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.pill{font-family:var(--f-num);font-weight:700;font-size:15px;padding:3px 9px;border-radius:4px;color:#fff;white-space:nowrap}
.pill.win{background:var(--win)}.pill.draw{background:var(--draw);color:#1b1506}.pill.loss{background:var(--loss)}.pill.next{background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.form{display:flex;gap:5px}
.form i{width:24px;height:24px;border-radius:3px;display:grid;place-items:center;font-style:normal;font-family:var(--f-num);font-weight:700;font-size:13px;color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stats b{display:block;font-family:var(--f-num);font-size:30px;line-height:1;color:var(--ouro)}
.stats span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}

/* elenco */
.squad{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.player{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:4px;position:relative;min-width:0}
.player .n{font-family:var(--f-display);font-weight:900;font-size:40px;line-height:.9;color:var(--vinho-2)}
.player .nm{font-weight:700;overflow-wrap:anywhere}
.player .ps{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.badge{position:absolute;top:10px;right:10px;font-family:var(--f-num);font-size:11px;text-transform:uppercase;letter-spacing:.08em;background:var(--ouro);color:var(--ouro-fg);padding:2px 6px;border-radius:3px;font-weight:700}
.group-t{font-family:var(--f-num);text-transform:uppercase;letter-spacing:.12em;font-size:13px;color:var(--muted);margin-top:4px}

/* torcida */
.guess{display:grid;grid-template-columns:1fr 64px 18px 64px 1fr;gap:8px;align-items:center}
.guess input{width:64px;text-align:center;font-family:var(--f-num);font-size:28px;padding:6px 0;border-radius:6px;border:1px solid var(--line);background:var(--surface-2)}
.guess .team{font-size:17px}
.btn{background:var(--ouro);color:var(--ouro-fg);border:0;border-radius:6px;padding:11px 16px;font-family:var(--f-num);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:15px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.opts{display:grid;gap:8px}
.opt{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.opt[aria-pressed="true"]{border-color:var(--ouro);box-shadow:inset 3px 0 0 var(--ouro)}
.opt span:first-child{min-width:0;overflow-wrap:anywhere}
.ok{color:var(--win);font-size:14px;margin:0}
.note{font-size:13px;color:var(--muted);margin:0}

/* apoie */
.goal-bar{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden;border:1px solid var(--line)}
.goal-bar div{height:100%;background:linear-gradient(90deg,var(--vinho-2),var(--ouro))}
.pix{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pix code{font-family:var(--f-num);font-size:18px;background:var(--surface-2);padding:8px 12px;border-radius:6px;border:1px dashed var(--ouro);user-select:all;overflow-wrap:anywhere;min-width:0}
.tiers{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.tier{border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:6px;background:var(--surface)}
.tier h3{font-size:22px;text-transform:uppercase}
.tier .price{font-family:var(--f-num);font-size:24px;color:var(--ouro);font-weight:700}
.tier ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
.sponsors{display:flex;flex-wrap:wrap;gap:8px}
.sponsors span{font-family:var(--f-display);font-weight:800;letter-spacing:.06em;font-size:20px;border:1px solid var(--line);border-radius:6px;padding:6px 14px;background:var(--surface)}

/* notícias */
.news{display:grid;gap:12px}
.post{border-left:3px solid var(--vinho-2);padding:2px 0 2px 14px;display:grid;gap:4px}
.post time{font-family:var(--f-num);font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.post h3{font-family:var(--f-body);font-weight:700;font-size:19px;line-height:1.25}
.post p{margin:0;color:var(--muted);max-width:65ch}

footer{border-top:1px solid var(--line);color:var(--muted);font-size:13px}
footer .wrap{padding-block:20px;display:grid;gap:6px}
footer a{color:var(--ouro)}

/* edição */
.edit-fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto}
.sheet .wrap{padding-block:16px 100px;display:grid;gap:16px}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;background:var(--bg);padding-block:8px;z-index:2}
.fld{display:grid;gap:4px;min-width:0}
.fld label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.fld input,.fld textarea,.fld select{width:100%;padding:9px 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2)}
.fgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.lrow{display:grid;gap:8px;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.lrow .acts{display:flex;justify-content:flex-end}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.savebar .wrap{padding-block:10px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.toast{font-size:14px;color:var(--muted)}

/* ===== motion ===== */
@keyframes rise{from{transform:translateY(14px);opacity:.35}to{transform:none;opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-5px) rotate(1deg)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 4px 10px rgba(0,0,0,.45)) drop-shadow(0 0 0 rgba(217,162,46,0))}50%{filter:drop-shadow(0 4px 10px rgba(0,0,0,.45)) drop-shadow(0 0 14px rgba(217,162,46,.55))}}
@keyframes beam{0%,100%{transform:rotate(-18deg) translateX(-10%);opacity:.35}50%{transform:rotate(-8deg) translateX(10%);opacity:.6}}
@keyframes beam2{0%,100%{transform:rotate(16deg) translateX(8%);opacity:.3}50%{transform:rotate(6deg) translateX(-12%);opacity:.55}}
@keyframes sheen{0%{transform:translateX(-130%) skewX(-20deg)}55%,100%{transform:translateX(230%) skewX(-20deg)}}
@keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes flip{0%{transform:rotateX(0)}45%{transform:rotateX(90deg);opacity:.4}100%{transform:rotateX(0)}}
@keyframes livepulse{0%{box-shadow:0 0 0 0 rgba(217,162,46,.6)}100%{box-shadow:0 0 0 10px rgba(217,162,46,0)}}
@keyframes viewin{from{transform:translateY(10px);opacity:.3}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.hero .lights{position:absolute;inset:-40% -20% auto;height:160%;pointer-events:none;z-index:0}
.hero .lights i{position:absolute;top:0;width:38%;height:100%;background:linear-gradient(180deg,rgba(255,236,190,.22),rgba(255,236,190,0) 70%);filter:blur(6px);transform-origin:top center}
.hero .lights i:nth-child(1){left:8%;animation:beam 9s ease-in-out infinite}
.hero .lights i:nth-child(2){right:4%;animation:beam2 11s ease-in-out infinite}
.hero .wrap>*{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.hero .wrap>*:nth-child(2){animation-delay:.08s}.hero .wrap>*:nth-child(3){animation-delay:.16s}
.crest-wrap{position:relative;flex:none;animation:floaty 5s ease-in-out infinite}
.crest-wrap .crest{animation:glow 4s ease-in-out infinite;display:block}
.brand h1{position:relative;overflow:hidden;background:linear-gradient(100deg,#FFF7EA 40%,#FFE3A1 50%,#FFF7EA 60%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 6s linear infinite}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
.board{position:relative;overflow:hidden}
.board::after{content:"";position:absolute;top:0;bottom:0;width:30%;background:linear-gradient(90deg,transparent,rgba(255,227,161,.14),transparent);animation:sheen 5.5s ease-in-out 1.2s infinite;pointer-events:none}
.board .eyebrow{display:flex;align-items:center;gap:8px}
.board .eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:#D9A22E;animation:livepulse 1.6s ease-out infinite}
.count b{perspective:200px}
.count b.tickd{animation:flip .45s ease}
.ticker{background:var(--ouro);color:var(--ouro-fg);overflow:hidden;white-space:nowrap;font-family:var(--f-num);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:13px}
.ticker div{display:inline-block;padding-block:7px;animation:ticker 28s linear infinite}
.ticker span{padding-inline:18px}
nav.tabs button{transition:color .2s,border-color .25s}
nav.tabs button:hover{color:var(--fg)}
#view.swap{animation:viewin .45s cubic-bezier(.2,.7,.2,1)}
#view .panel,#view .player,#view .match,#view .post,#view .tier,#view .slot,#view .sponsors span{animation:rise .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 45ms)}
.player{transition:transform .25s,box-shadow .25s,border-color .25s}
.player:hover{transform:translateY(-4px) rotate(-.6deg);box-shadow:0 10px 24px rgba(0,0,0,.25);border-color:var(--ouro)}
.player .badge{animation:livepulse 2.2s ease-out infinite}
.btn{transition:transform .15s,filter .2s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.96)}
.opt{transition:border-color .2s,transform .15s,background .2s}
.opt:active{transform:scale(.98)}
.opt[aria-pressed="true"]{animation:pop .35s ease}
.goal-bar div{transition:width 1.4s cubic-bezier(.2,.7,.2,1);position:relative;overflow:hidden}
.goal-bar div::after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:sheen 3s ease-in-out infinite}
.stats b{display:inline-block}

/* ===== álbum ===== */
.album-top{display:grid;gap:10px}
.prog{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.prog b{font-family:var(--f-display);font-size:38px;font-weight:900;color:var(--ouro);line-height:1}
.packzone{display:grid;justify-items:center;gap:14px;padding-block:10px 4px;text-align:center}
.pack{width:170px;aspect-ratio:3/4;max-width:100%;border-radius:10px;position:relative;cursor:pointer;border:0;padding:0;
  background:
   linear-gradient(135deg,rgba(255,255,255,.18) 0 10%,transparent 10% 50%,rgba(255,255,255,.1) 50% 60%,transparent 60%),
   linear-gradient(160deg,#9A3040,#5A1824 60%,#2a0b11);
  box-shadow:0 14px 30px rgba(0,0,0,.35),inset 0 0 0 3px #D9A22E;overflow:hidden;color:#FFF3DC;
  animation:floaty 3.2s ease-in-out infinite}
.pack::before,.pack::after{content:"";position:absolute;left:0;right:0;height:14px;background:repeating-linear-gradient(90deg,#D9A22E 0 8px,#B9821A 8px 16px)}
.pack::before{top:0}.pack::after{bottom:0}
.pack .pk-crest{position:absolute;inset:18% 20% 30%;background:var(--crest) center/contain no-repeat;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.pack .pk-t{position:absolute;left:0;right:0;bottom:22px;font-family:var(--f-display);font-weight:900;font-size:20px;letter-spacing:.06em;text-transform:uppercase}
.pack .pk-s{position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);background-size:250% 100%;animation:shine 2.8s linear infinite;mix-blend-mode:overlay}
.pack[disabled]{filter:grayscale(.7) brightness(.7);cursor:default;animation:none}
.wait{font-family:var(--f-num);font-size:15px;color:var(--muted)}
.wait b{font-size:22px;color:var(--fg);font-variant-numeric:tabular-nums}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.slot{aspect-ratio:3/4;max-width:100%;border-radius:8px;border:2px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-family:var(--f-display);font-weight:800;font-size:30px;background:var(--surface);min-width:0}
.slot small{display:block;font-family:var(--f-body);font-size:11px;font-weight:500;letter-spacing:.04em;text-align:center}
.slot.fresh .stk{animation:pop .6s ease}

.stk{width:100%;height:100%;border-radius:8px;position:relative;overflow:hidden;color:#FFF3DC;
  background:
   repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 10px,transparent 10px 20px),
   radial-gradient(circle at 50% 38%,#A8384A 0,#7A2531 45%,#3F121B 100%);
  box-shadow:inset 0 0 0 3px #D9A22E;display:block}
.stk .s-num{position:absolute;top:6px;left:8px;font-family:var(--f-display);font-weight:900;font-size:clamp(20px,6vw,30px);color:#FFE3A1;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.stk .s-cr{position:absolute;top:6px;right:6px;width:22%;aspect-ratio:3/4;background:var(--crest) center/contain no-repeat}
.stk svg{position:absolute;left:12%;right:12%;bottom:24%;width:76%;height:auto}
.stk .s-name{position:absolute;left:0;right:0;bottom:0;background:#0C0D13;padding:5px 4px 6px;text-align:center;border-top:2px solid #D9A22E}
.stk .s-name b{display:block;font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:clamp(12px,3.4vw,16px);line-height:1.05;overflow-wrap:anywhere;color:#FFF7EA}
.stk .s-name i{font-style:normal;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#D9A22E}

function resultadoTipo(r){return +r.gp>+r.gc?'win':+r.gp<+r.gc?'loss':'draw'}
function linhaJogo(r){
  const casa = r.mando!=='fora';
  const a = casa? short(S.clube.nome) : r.adversario, b = casa? r.adversario : short(S.clube.nome);
  const placar = casa? `${r.gp} × ${r.gc}` : `${r.gc} × ${r.gp}`;
  return `<div class="match"><div class="d">${esc(fmtD(r.data))}</div><div class="t">${esc(a)} × ${esc(b)}<small>${esc(r.competicao||'')}</small></div><span class="pill ${resultadoTipo(r)}">${esc(placar)}</span></div>`;
}
function linhaAgenda(g){
  const casa = g.mando!=='fora';
  const a = casa? short(S.clube.nome) : g.adversario, b = casa? g.adversario : short(S.clube.nome);
  return `<div class="match"><div class="d">${esc(fmtD(g.data))}<br>${esc(g.hora||'')}</div><div class="t">${crestImg(g.adversario,32)}<span>${esc(a)} × ${esc(b)}<small>${esc(g.local||'')} · ${esc(g.competicao||'')}</small></span></div><span class="pill next">${esc(g.categoria||(casa?'Casa':'Fora'))}</span></div>`;
}
function stats(){
  let v=0,e=0,d=0,gp=0,gc=0;
  RES().forEach(r=>{const t=resultadoTipo(r);t==='win'?v++:t==='loss'?d++:e++;gp+=+r.gp||0;gc+=+r.gc||0});
  return {j:RES().length,v,e,d,gp,gc};
}

function hero(){
  const p=S.proximo, casa=p.mando!=='fora';
  const a=casa?short(S.clube.nome):p.adversario, b=casa?p.adversario:short(S.clube.nome);
  return `<header class="hero"><div class="lights" aria-hidden="true"><i></i><i></i></div><div class="wrap">
    <div class="brand">${crest}<div><div class="tag">${esc(S.clube.titulo)}</div><h1>${esc(S.clube.nome)}</h1></div></div>
    <p class="slogan">“${esc(S.clube.slogan)}” · ${esc(S.clube.cidade)}</p>
    <div class="board" aria-label="Próximo jogo">
      <div class="eyebrow" style="color:#E8C77A">Próximo jogo · ${esc(p.competicao)}</div>
      <div class="row"><div class="team">${crestImg(a)}<span>${esc(a)}</span></div><div class="vs">×</div><div class="team r"><span>${esc(b)}</span>${crestImg(b)}</div></div>
      <div class="meta"><span>📅 ${esc(p.data?fmtD(p.data):'Data a definir')}${p.hora?' · '+esc(p.hora):''}</span><span>📍 ${esc(p.local)}</span></div>
      <div class="count" id="count" ${p.data?'':'hidden'}><div><b id="cd-d">0</b><span>dias</span></div><div><b id="cd-h">0</b><span>horas</span></div><div><b id="cd-m">0</b><span>min</span></div><div><b id="cd-s">0</b><span>seg</span></div></div>
    </div>
  </div></header>${tickerHTML()}`;
}

function tickerHTML(){
  const p=S.proximo, items=[`Próximo jogo: ${p.adversario} × ${short(S.clube.nome)}`, p.data?`${fmtD(p.data)} · ${p.hora}`:'Data a definir', p.local, S.clube.titulo, `@${S.clube.instagram}`, 'Abra seu pacote de figurinhas hoje'];
  const row=items.map(t=>`<span>★ ${esc(t)}</span>`).join('');
  return `<div class="ticker" aria-hidden="true"><div>${row}${row}</div></div>`;
}
function vInicio(){
  const s=stats(), last=RES().slice(-5);
  return `<section><div class="grid2">
    <div class="panel"><div class="eyebrow">Campanha</div>
      <div class="stats"><div><b class="num">${s.j}</b><span>Jogos</span></div><div><b class="num">${s.v}</b><span>Vitórias</span></div><div><b class="num">${s.e}</b><span>Empates</span></div><div><b class="num">${s.gp}</b><span>Gols</span></div></div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><span class="note">Últimos jogos</span><div class="form">${last.map(r=>{const t=resultadoTipo(r);return `<i style="background:var(--${t})">${t==='win'?'V':t==='loss'?'D':'E'}</i>`}).join('')||'<span class="note">Sem jogos ainda</span>'}</div></div>
    </div>
    <div class="panel"><div class="eyebrow">Apoie o clube</div><h3 style="font-size:24px">${esc(S.apoio.campanha)}</h3>${metaBar()}<button class="btn" data-go="apoie">Doar via PIX</button></div>
  </div></section>
  ${usGames().length?`<section><div class="panel" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">${crestImg((()=>{const g=curDuel();return isUs(g.casa)?g.fora:g.casa})(),48)}<div style="min-width:0;flex:1"><div class="eyebrow">Próximo confronto</div><b style="font-size:18px">${esc((()=>{const g=curDuel();return g.casa+' × '+g.fora})())}</b></div><button class="btn sm" data-go="jogos">Ver confronto</button></div></section>`:''}
  <section><h2>${esc(S.grupo.nome)}</h2>${tabelaHTML(true)}<div><button class="btn ghost sm" data-go="classificacao">Classificação completa</button></div></section>
  ${leaderHTML()}
  <section><h2>Últimas do União</h2><div class="news">${S.noticias.slice(0,2).map(post).join('')}</div><div><button class="btn ghost sm" data-go="noticias">Todas as notícias</button></div></section>
  <section><div class="panel" style="grid-template-columns:auto 1fr;align-items:center"><div style="width:74px;aspect-ratio:3/4">${stkHTML(stickers()[0])}</div><div style="display:grid;gap:8px;min-width:0"><div class="eyebrow">Álbum de figurinhas</div><h3 style="font-size:22px">Abra seu pacote de hoje</h3><div><button class="btn sm" data-go="album">Abrir álbum</button></div></div></div></section>

}
function vJogos(){
  const s=stats();
  return `${vConfronto()}<section><h2>Agenda</h2><div class="panel">${S.agenda.length?S.agenda.map(linhaAgenda).join(''):'<p class="note">Nenhum jogo marcado.</p>'}</div></section>
  <section><h2>Resultados</h2><p class="sub">${s.v} vitórias, ${s.e} empates e ${s.d} derrotas · saldo ${s.gp-s.gc>=0?'+':''}${s.gp-s.gc}</p><div class="panel">${RES().length?RES().slice().reverse().map(linhaJogo).join(''):'<p class="note">Nenhum resultado ainda.</p>'}</div></section>`;
}
function vElenco(){
  const ordem=['Titular','Reserva','Goleiro','Defesa','Meio-campo','Ataque','Comissão técnica'];
  const grupos={}; S.elenco.forEach(p=>{(grupos[p.pos]=grupos[p.pos]||[]).push(p)});
  const keys=Object.keys(grupos).sort((a,b)=>(ordem.indexOf(a)+99)%99-(ordem.indexOf(b)+99)%99);
  return `<section><div class="squad-h"><h2 id="sq-t">Elenco 2026</h2></div><p class="sub">${S.elenco.length} atletas inscritos no Municipal 2026 · ⚽ gols · 👟 assistências</p>${keys.map(k=>`<div class="group-t">${esc(k)}</div><div class="squad">${grupos[k].map(p=>`<div class="player">${p.foto?`<span class="ph"><img src="${esc(p.foto)}" alt="${esc(p.nome)}" loading="lazy"><span class="n num">${esc(p.num)}</span></span>`:`<div class="n num">${esc(p.num)}</div>`}${p.reforco?'<span class="badge">Reforço</span>':''}<span class="flash"></span><div class="nm">${esc(p.nome)}</div><div class="ps">${esc(p.pos)}</div>${(+p.gols||+p.assist)?`<div class="st"><span>⚽ <b>${+p.gols||0}</b></span><span>👟 <b>${+p.assist||0}</b></span></div>`:''}</div>`).join('')}</div>`).join('')}</section>`;
}
function vTorcida(){
  const p=S.proximo, casa=p.mando!=='fora';
  const a=casa?short(S.clube.nome):p.adversario, b=casa?p.adversario:short(S.clube.nome);
  const pal=LS.get('palpite:'+p.data+p.adversario,null), cr=LS.get('craque:'+(RES().at(-1)||{}).data,null), en=LS.get('enquete:'+S.enquete.pergunta,null);

const SIL='<svg viewBox="0 0 100 90" aria-hidden="true"><path d="M50 6c11 0 19 9 19 20s-8 21-19 21-19-10-19-21S39 6 50 6z" fill="rgba(12,13,19,.55)"/><path d="M8 90c2-20 18-32 42-32s40 12 42 32z" fill="rgba(12,13,19,.55)"/><path d="M38 60l12 14 12-14" fill="none" stroke="#D9A22E" stroke-width="3"/></svg>';
function stickers(){
  const list=[{id:'escudo',num:'00',nome:'Escudo',pos:'União Canindé F.C.',holo:true,esc:true}];
  S.elenco.slice().sort((a,b)=>(+a.num||99)-(+b.num||99)).forEach(p=>list.push({id:'p'+p.num,num:p.num,nome:p.nome,pos:p.reforco?'Reforço 2026':p.pos,holo:!!p.reforco}));

function stkHTML(k){

const todayKey=()=>{try{return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Maceio'}).format(new Date())}catch(e){return new Date(Date.now()-3*3600e3).toISOString().slice(0,10)}};
function albumState(){const a=LS.get('album',{owned:[],last:'',fresh:[]});a.owned=a.owned||[];a.fresh=a.fresh||[];return a;}
function canOpen(a){const all=stickers();return a.last!==todayKey() && a.owned.length<all.length;}
function vAlbum(){
  const a=albumState(), all=stickers(), have=new Set(a.owned), n=all.filter(k=>have.has(k.id)).length, done=n===all.length;

  </div>

let waitTimer;
function albumTick(){
  clearInterval(waitTimer);
  const el=$('#pack-wait'); if(!el) return;
  const upd=()=>{const e=$('#pack-wait'); if(!e){clearInterval(waitTimer);return;}
    const now=Date.now(), local=now-3*3600e3, next=(Math.floor(local/86400e3)+1)*86400e3, ms=next-local;
    if(ms<1000||canOpen(albumState())){clearInterval(waitTimer);renderView(false);return;}
    const h=Math.floor(ms/3600e3),m=Math.floor(ms%3600e3/60e3),sx=Math.floor(ms%60e3/1e3);
    e.textContent=[h,m,sx].map(x=>String(x).padStart(2,'0')).join(':');};
  upd(); waitTimer=setInterval(upd,1000);
}
function openPack(){
  const a=albumState(); if(!canOpen(a)) return;
  const all=stickers(), have=new Set(a.owned), pool=all.filter(k=>!have.has(k.id));
  const qty=a.owned.length===0?3:1, got=[];
  for(let i=0;i<qty&&pool.length;i++){got.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);}
  a.owned=a.owned.concat(got.map(k=>k.id)); a.last=todayKey(); a.fresh=got.map(k=>k.id); LS.set('album',a);
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ov=document.createElement('div'); ov.className='ov'; ov.setAttribute('role','dialog'); ov.setAttribute('aria-label','Abrindo pacote');
  ov.innerHTML=`<div class="rays"></div><div class="burst"></div><div class="stage"><h3 id="ov-t">Abrindo…</h3><button class="pack" id="ov-pack" aria-hidden="true" tabindex="-1"><span class="pk-crest"></span><span class="pk-s"></span><span class="pk-t">Pacote do dia</span></button><div class="fan" hidden>${got.map(k=>`<div class="card3d"><div class="in"><div class="face">${stkHTML(k)}</div><div class="back"></div></div></div>`).join('')}</div><button class="btn" id="pack-done" hidden>Colar no álbum</button></div>`;
  document.body.appendChild(ov);
  const pk=$('#ov-pack',ov), fan=$('.fan',ov), T=reduce?[0,0,0,0]:[0,700,1150,1500];
  setTimeout(()=>pk.classList.add('shake'),T[0]);
  setTimeout(()=>pk.classList.add('tear'),T[1]);
  setTimeout(()=>pk.classList.add('gone'),T[2]);
  setTimeout(()=>{
    pk.hidden=true; fan.hidden=false; $('.rays',ov).classList.add('on');
    const holo=got.some(k=>k.holo);
    $('#ov-t',ov).textContent=got.length>1?'Suas primeiras figurinhas!':(holo?'Figurinha brilhante!':'Figurinha nova!');
    fan.querySelectorAll('.card3d').forEach((c,i)=>setTimeout(()=>c.classList.add('show'),reduce?0:i*260));
    if(!reduce) confetti($('.burst',ov));
    setTimeout(()=>{const b=$('#pack-done',ov);b.hidden=false;b.focus();},reduce?0:got.length*260+700);
  },T[3]);
}
function confetti(box){
  const cols=['#D9A22E','#FFE3A1','#9A3040','#C7CBD2','#FFFFFF'];
  for(let i=0;i<70;i++){const e=document.createElement('i');const ang=Math.random()*Math.PI*2,dist=140+Math.random()*260;
    e.style.cssText=`--c:${cols[i%cols.length]};--x:${Math.cos(ang)*dist}px;--y:${Math.sin(ang)*dist+120}px;--r:${Math.random()*720-360}deg;animation-delay:${Math.random()*.15}s`;box.appendChild(e);}
}
document.addEventListener('click',e=>{
  const t=e.target.closest('#pack-open,#pack-open2,#pack-done'); if(!t) return;
  if(t.id==='pack-done'){const ov=$('.ov');if(ov)ov.remove();renderView(false);const f=$('.slot.fresh');if(f)f.scrollIntoView({behavior:'smooth',block:'center'});const a=albumState();a.fresh=[];LS.set('album',a);return;}
  openPack();
});

/* ===== Classificação do grupo ===== */
const isUs=n=>String(n||'').toLowerCase().includes('união canindé')||String(n||'').toLowerCase()===short(S.clube.nome).toLowerCase();
function tabela(){
  const G=S.grupo||{times:[],jogos:[]}, T={};
  G.times.forEach(n=>T[n]={nome:n,pts:0,j:0,v:0,e:0,d:0,ca:0,cv:0,gp:0,gc:0});
  G.jogos.forEach(g=>{
    const c=T[g.casa],f=T[g.fora]; if(!c||!f) return;
    // cartões contam mesmo antes de fechar o placar
    c.ca+=+g.cac||0; f.ca+=+g.caf||0; c.cv+=+g.cvc||0; f.cv+=+g.cvf||0;
    if(!g.jogado) return;
    const x=+g.gc||0,y=+g.gf||0;
    c.j++;f.j++; c.gp+=x;c.gc+=y; f.gp+=y;f.gc+=x;
    if(x>y){c.v++;c.pts+=3;f.d++}else if(x<y){f.v++;f.pts+=3;c.d++}else{c.e++;f.e++;c.pts++;f.pts++}
  });
  return Object.values(T).map(t=>(t.sg=t.gp-t.gc,t)).sort((a,b)=>b.pts-a.pts||b.v-a.v||b.sg-a.sg||b.gp-a.gp||a.gc-b.gc||a.cv-b.cv||a.ca-b.ca||a.nome.localeCompare(b.nome));
}
function RES(){
  const extra=((S.grupo||{}).jogos||[]).filter(g=>g.jogado&&(isUs(g.casa)||isUs(g.fora))).map(g=>{const casa=isUs(g.casa);return {data:g.data,adversario:casa?g.fora:g.casa,mando:casa?'casa':'fora',gp:casa?+g.gc:+g.gf,gc:casa?+g.gf:+g.gc,competicao:'Municipal 2026 · '+S.grupo.nome+' · '+g.rodada+' rodada'}});
  return S.resultados.concat(extra).sort((a,b)=>String(a.data).localeCompare(String(b.data)));
}

function TM(n){const T=S.times||{};const k=Object.keys(T).find(k=>k.toLowerCase()===String(n||'').toLowerCase());const t=k?T[k]:{};return {cor:t.cor||'#3a3b48',cor2:t.cor2||'#1d1e29',apelido:t.apelido||'',escudo:isUs(n)?CREST_SRC:(t.escudo||'')};}
function crestImg(n,size){const t=TM(n),sz=size?`width:${size}px;height:${size}px;`:'';return t.escudo?`<span class="mc" style="${sz}"><img src="${t.escudo}" alt="Escudo ${esc(n)}"></span>`:`<span class="mc ini" style="${sz}font-size:${Math.round((size||40)*.38)}px" aria-hidden="true">${esc(initials(n))}</span>`;}
function usGames(){return ((S.grupo||{}).jogos||[]).map((g,i)=>({...g,i})).filter(g=>isUs(g.casa)||isUs(g.fora));}
let duelIdx=null;
function curDuel(){const L=usGames(); if(!L.length) return null; if(duelIdx==null){const n=L.find(g=>!g.jogado); duelIdx=(n||L[L.length-1]).i;} return L.find(g=>g.i===duelIdx)||L[0];}
function teamForm(n){return ((S.grupo||{}).jogos||[]).filter(g=>g.jogado&&(g.casa===n||g.fora===n)).map(g=>{const me=g.casa===n?+g.gc:+g.gf,op=g.casa===n?+g.gf:+g.gc;return me>op?'win':me<op?'loss':'draw'});}
function duelHTML(g){
  const A=TM(g.casa),B=TM(g.fora), L=tabela(), pa=L.findIndex(t=>t.nome===g.casa)+1, pb=L.findIndex(t=>t.nome===g.fora)+1;
  const ta=L.find(t=>t.nome===g.casa)||{pts:0}, tb=L.find(t=>t.nome===g.fora)||{pts:0};
  const mid=g.jogado?`<span class="score num">${+g.gc} <span style="color:#FFE3A1">×</span> ${+g.gf}</span><span class="when">Encerrado</span>`:`<span class="vs">VS</span><span class="when">${esc(fmtD(g.data)).toUpperCase()}<br>${esc(g.hora||'')}</span>`;
  return `<div class="duel" id="duel" style="--ca:${A.cor};--cb:${B.cor}"><div class="bg"></div><div class="grain"></div><span class="seam"></span><span class="shock"></span>
    <div class="in"><div class="tag"><span>Municipal 2026 · ${esc(S.grupo.nome)}</span><b>${esc(g.rodada)} rodada · 1º Quadro</b></div>
    <div class="row"><div class="side a">${crestImg(g.casa)}<b>${esc(g.casa)}</b><small>${pa}º · ${ta.pts} pts</small></div><div class="mid">${mid}</div><div class="side b">${crestImg(g.fora)}<b>${esc(g.fora)}</b><small>${pb}º · ${tb.pts} pts</small></div></div>
    <div class="place">📍 ${esc(S.proximo&&S.proximo.local||'Estádio André Avelino “Andrezão”')}</div>
    ${g.jogado||!g.data?'':`<div class="cd" data-at="${esc(g.data)}T${esc(g.hora||'16:00')}:00-03:00"><div><b>0</b><span>dias</span></div><div><b>0</b><span>horas</span></div><div><b>0</b><span>min</span></div><div><b>0</b><span>seg</span></div></div>`}
    </div></div>`;
}
function xrayHTML(g){
  const L=tabela(), A=L.find(t=>t.nome===g.casa)||{}, B=L.find(t=>t.nome===g.fora)||{}, ca=TM(g.casa).cor, cb=TM(g.fora).cor;
  const rows=[['Pontos','pts',1],['Vitórias','v',1],['Gols pró','gp',1],['Gols sofridos','gc',-1],['Saldo','sg',1],['Amarelos','ca',-1],['Vermelhos','cv',-1]];
  return `<div class="xray">${rows.map(([lb,k,dir])=>{const x=+A[k]||0,y=+B[k]||0,m=Math.max(Math.abs(x),Math.abs(y),1);const bx=x!==y&&((x>y)===(dir>0)),by=x!==y&&!bx;
    return `<div class="xr"><span class="v l${bx?' best':''}">${x}</span><span class="tr l"><i data-w="${Math.round(Math.abs(x)/m*100)}" style="background:${ca}"></i></span><span class="lb">${lb}</span><span class="tr"><i data-w="${Math.round(Math.abs(y)/m*100)}" style="background:${cb}"></i></span><span class="v r${by?' best':''}">${y}</span></div>`}).join('')}</div>`;
}
function formHTML(n){const f=teamForm(n);return `<div style="display:flex;align-items:center;gap:10px;min-width:0">${crestImg(n,30)}<b style="min-width:0;overflow-wrap:anywhere">${esc(n)}</b><div class="form" style="margin-left:auto">${f.length?f.slice(-5).map(t=>`<i style="background:var(--${t})">${t==='win'?'V':t==='loss'?'D':'E'}</i>`).join(''):'<span class="note">Sem jogos</span>'}</div></div>`;}
function vConfronto(){

      ${pk?`<p class="ok">Palpite salvo. Vamos ver no dia ${esc(fmtD(g.data))}!</p>`:'<p class="note">Seu palpite fica salvo neste aparelho.</p>'}

let duelTimer;
function duelAnim(){
  clearInterval(duelTimer);
  const d=$('#duel'); if(!d) return;
  const cd=d.querySelector('.cd');
  if(cd){const t=new Date(cd.dataset.at).getTime();const bs=cd.querySelectorAll('b');const up=()=>{if(!document.body.contains(cd)){clearInterval(duelTimer);return;}let x=Math.max(0,t-Date.now())/1000;[Math.floor(x/86400),Math.floor(x%86400/3600),Math.floor(x%3600/60),Math.floor(x%60)].forEach((v,i)=>bs[i].textContent=v);};up();duelTimer=setInterval(up,1000);}
  requestAnimationFrame(()=>document.querySelectorAll('.xr i[data-w]').forEach(i=>i.style.width=i.dataset.w+'%'));
  const G=window.gsap; if(!G||matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const tl=G.timeline({defaults:{ease:'power3.out'}});
  tl.from(d.querySelector('.bg'),{scaleX:1.25,opacity:0,duration:.6})
    .from(d.querySelector('.side.a'),{x:-160,rotation:-14,opacity:0,duration:.75,ease:'back.out(1.7)'},'-=.25')
    .from(d.querySelector('.side.b'),{x:160,rotation:14,opacity:0,duration:.75,ease:'back.out(1.7)'},'<')
    .from(d.querySelector('.seam'),{scaleY:0,duration:.35,ease:'expo.out'},'-=.35')
    .from(d.querySelector('.mid'),{scale:3,opacity:0,duration:.5,ease:'expo.out'},'-=.15')
    .fromTo(d.querySelector('.shock'),{scale:.2,opacity:.95},{scale:16,opacity:0,duration:.8,ease:'power2.out'},'<')
    .to(d,{x:'+=6',duration:.05,repeat:5,yoyo:true,ease:'none'},'<')
    .from(d.querySelectorAll('.tag,.place,.cd'),{y:12,opacity:0,stagger:.08,duration:.4},'-=.45');
  G.to(d.querySelectorAll('.side .mc'),{y:-6,duration:1.8,repeat:-1,yoyo:true,ease:'sine.inOut',stagger:.4,delay:1.4});
  if(matchMedia('(hover:hover)').matches){
    const rx=G.quickTo(d,'rotationX',{duration:.5}),ry=G.quickTo(d,'rotationY',{duration:.5});
    d.addEventListener('pointermove',e=>{const r=d.getBoundingClientRect();ry(((e.clientX-r.left)/r.width-.5)*8);rx(-((e.clientY-r.top)/r.height-.5)*6);});
    d.addEventListener('pointerleave',()=>{rx(0);ry(0);});
  }
}

function elencoAnim(){
  const G=window.gsap; if(!G||matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const v=$('#view'), cards=[...v.querySelectorAll('.player')]; if(!cards.length) return;
  const tl=G.timeline({defaults:{ease:'power3.out'}});
  tl.from('#sq-t',{scale:2.4,opacity:0,duration:.5,ease:'expo.out'});
  v.querySelectorAll('.group-t').forEach(gt=>tl.from(gt,{x:-40,opacity:0,duration:.35},'-=.2'));
  cards.forEach((c,i)=>{
    const left=i%2===0, n=c.querySelector('.n'), f=c.querySelector('.flash'), at=i===0?'-=.1':'<+=0.07';
    tl.from(c,{x:left?-140:140,rotation:left?-12:12,opacity:0,duration:.7,ease:'back.out(1.7)'},at);
    if(n) tl.from(n,{scale:3,opacity:0,duration:.45,ease:'expo.out'},'<+=0.25');
    if(f) tl.fromTo(f,{opacity:.9,scale:.6},{opacity:0,scale:1.4,duration:.6,ease:'power2.out'},'<');
  });
  tl.timeScale(cards.length>12?1.5:1);
}

const VIEWS={inicio:vInicio,jogos:vJogos,elenco:vElenco,torcida:vTorcida,classificacao:vClass,album:vAlbum,patrocinadores:vPatrocinadores,apoie:vApoie,noticias:vNoticias};

function render(){
  $('#root').innerHTML = hero() +
  `<nav class="tabs" aria-label="Seções"><div class="wrap" role="tablist">${TABS.map(([k,l])=>`<button role="tab" aria-selected="${k===tab}" data-tab="${k}">${l}</button>`).join('')}</div></nav>
  <main><div class="wrap" id="view"></div></main>
  ${spStrip()}
  <footer><div class="wrap"><div>${esc(S.clube.nome)} · ${esc(S.clube.cidade)}</div><div>Instagram: <a href="https://instagram.com/${esc(S.clube.instagram)}" target="_blank" rel="noopener">@${esc(S.clube.instagram)}</a></div><div>Site por EA Comunicação · HUB Sertão Conecta</div></div></footer>
  ${canEdit?'<button class="btn edit-fab" id="edit-open">Editar site</button>':''}`;

function renderView(swap){
  const v=$('#view'); if(!v) return;
  v.innerHTML=VIEWS[tab]();
  v.querySelectorAll('.panel,.player,.match,.post,.tier,.slot,.sponsors span').forEach((el,i)=>el.style.setProperty('--i',Math.min(i,16)));
  document.querySelectorAll('nav.tabs [data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
  if(swap){v.classList.remove('swap');void v.offsetWidth;v.classList.add('swap');}
  requestAnimationFrame(()=>v.querySelectorAll('.goal-bar div[data-w],.rk .bar i[data-w]').forEach(b=>b.style.width=b.dataset.w+'%'));
  countUp(v);
  if(tab==='album') albumTick();
  if(tab==='jogos') duelAnim();
  if(tab==='elenco') elencoAnim();
}
function countUp(root){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  root.querySelectorAll('.stats b').forEach(el=>{const end=+el.textContent;if(!end)return;let t0;const step=ts=>{t0=t0||ts;const k=Math.min(1,(ts-t0)/900);el.textContent=Math.round(end*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step);});
}

function go(k){tab=k;try{history.replaceState(null,'','#'+k)}catch(e){}renderView(true);const n=$('nav.tabs');if(n&&window.scrollY>n.offsetTop)window.scrollTo({top:n.offsetTop,behavior:'smooth'});}

let cdTimer;
function tick(){
  clearInterval(cdTimer);
  const p=S.proximo; if(!p.data) return;
  const t=new Date(p.data+'T'+(p.hora||'16:00')+':00-03:00').getTime();
  const upd=()=>{const el=$('#cd-d'); if(!el) return; let d=Math.max(0,t-Date.now())/1000;
    const set=(id,v)=>{const e=$(id);if(e.textContent!==String(v)){e.textContent=v;e.classList.remove('tickd');void e.offsetWidth;e.classList.add('tickd');}};
    set('#cd-d',Math.floor(d/86400)); set('#cd-h',Math.floor(d%86400/3600)); set('#cd-m',Math.floor(d%3600/60)); set('#cd-s',Math.floor(d%60));};
  upd(); cdTimer=setInterval(upd,1000);
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-duel],[data-pick],[data-sp],[data-tab],[data-go],[data-craque],[data-enq],#g-save,#pix-copy,#edit-open');
  if(!t) return;
  if(t.dataset.sp!=null){go('patrocinadores');setTimeout(()=>{const c=$('#sp-'+t.dataset.sp);if(c)c.scrollIntoView({behavior:'smooth',block:'center'})},80);return;}
  if(t.dataset.duel!=null){duelIdx=+t.dataset.duel;return renderView(false);}
  if(t.dataset.pick){const g=curDuel();LS.set('duelo:'+g.i+':'+g.data,t.dataset.pick);const y=scrollY;renderView(false);scrollTo(0,y);return;}
  if(t.dataset.tab) return go(t.dataset.tab);
  if(t.dataset.go) return go(t.dataset.go);
  if(t.dataset.craque!=null){LS.set('craque:'+(RES().at(-1)||{}).data,t.dataset.craque);return renderView(false);}
  if(t.dataset.enq!=null){LS.set('enquete:'+S.enquete.pergunta,t.dataset.enq);return renderView(false);}
  if(t.id==='g-save'){const a=$('#g-a').value,b=$('#g-b').value;if(a===''||b==='')return;LS.set('palpite:'+S.proximo.data+S.proximo.adversario,{a,b});return renderView(false);}
  if(t.id==='pix-copy'){const m=$('#pix-msg');navigator.clipboard.writeText(S.apoio.pix).then(()=>{m.textContent='Chave copiada. Cole no app do seu banco.'},()=>{const r=document.createRange();r.selectNodeContents($('#pix'));const s=getSelection();s.removeAllRanges();s.addRange(r);m.textContent='Chave selecionada. Copie e cole no app do seu banco.'});return;}
  if(t.id==='edit-open') return openEditor();
});

function fld(path,label,type,val){
  const id='e-'+path.replace(/\W/g,'_');
  let inp;
  if(type==='logo') inp=`<div class="logo-edit"><span id="${id}-pv">${val?`<span class="splogo" style="width:56px;height:56px"><img src="${esc(val)}" alt=""></span>`:'<span class="note">Sem logo</span>'}</span><input type="hidden" id="${id}" data-p="${path}" value="${esc(val)}"><input type="file" accept="image/*" data-logo="${id}" aria-label="Enviar logo" style="max-width:220px">${val?`<button class="btn ghost sm" type="button" data-logo-clear="${id}">Tirar logo</button>`:''}</div>`;
  else if(type==='area') inp=`<textarea id="${id}" data-p="${path}" rows="3">${esc(val)}</textarea>`;
  else if(type&&type.startsWith('sel:')) inp=`<select id="${id}" data-p="${path}">${type.slice(4).split(',').map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  else if(type==='check') inp=`<input id="${id}" data-p="${path}" type="checkbox" ${val?'checked':''} style="width:auto">`;
  else inp=`<input id="${id}" data-p="${path}" type="${type||'text'}" value="${esc(val)}">`;
  return `<div class="fld"><label for="${id}">${esc(label)}</label>${inp}</div>`;
}
function grp(t,inner){return `<div class="panel"><div class="eyebrow">${t}</div>${inner}</div>`}

  h+=grp('Times do grupo',`${fld('grupo.nome','Nome do grupo','text',D.grupo.nome)}${fld('gtimes','Times (um por linha)','area',D.grupo.times.join('\n'))}`);
  h+=grp('Enquete',`${fld('enquete.pergunta','Pergunta','text',D.enquete.pergunta)}${fld('enq','Opções (uma por linha)','area',D.enquete.opcoes.join('\n'))}`);
  for(const k in LISTS){const L=LISTS[k];
    h+=grp(L.t,getP(D,k).map((row,i)=>`<div class="lrow"><div class="fgrid">${L.f.map(([f,l,t])=>fld(`${k}.${i}.${f}`,l,t==='TEAMS'?'sel:'+D.grupo.times.join(','):t,row[f])).join('')}</div><div class="acts"><button class="btn ghost sm" data-del="${k}.${i}">Remover</button></div></div>`).join('')+`<div><button class="btn ghost sm" data-add="${k}">Adicionar</button></div>`);

function getP(o,path){return path.split('.').reduce((x,k)=>x[k],o);}
function setPath(o,path,v){const ps=path.split('.');let x=o;for(let i=0;i<ps.length-1;i++)x=x[ps[i]];x[ps.at(-1)]=v;}
function collect(){
  document.querySelectorAll('#sheet [data-p]').forEach(el=>{
    const p=el.dataset.p; let v=el.type==='checkbox'?el.checked:el.value;
    if(el.type==='number') v=v===''?0:+v;
    if(p==='gtimes') D.grupo.times=v.split('\n').map(s=>s.trim()).filter(Boolean);
    else if(p==='enq') D.enquete.opcoes=v.split('\n').map(s=>s.trim()).filter(Boolean);
    else setPath(D,p,v);
  });
}
function openEditor(){D=JSON.parse(JSON.stringify(S));drawEditor();}
function drawEditor(){let w=$('#ed');if(!w){w=document.createElement('div');w.id='ed';document.body.appendChild(w);}w.innerHTML=editorHTML();}
function closeEditor(){const w=$('#ed');if(w)w.remove();}
document.addEventListener('click',async e=>{
  const t=e.target.closest('#e-close,#e-save,[data-add],[data-del]'); if(!t) return;
  if(t.id==='e-close') return closeEditor();
  collect();
  if(t.dataset.add){const k=t.dataset.add;getP(D,k).push(JSON.parse(JSON.stringify(LISTS[k].novo)));return drawEditor();}
  if(t.dataset.del){const ix=t.dataset.del.lastIndexOf('.'),k=t.dataset.del.slice(0,ix),i=+t.dataset.del.slice(ix+1);getP(D,k).splice(i,1);return drawEditor();}
  if(t.id==='e-save'){
    const msg=$('#e-msg'); t.disabled=true; msg.textContent='Publicando…';
    try{ await artifactApi.publish(buildDoc(D)); msg.textContent='Publicado.'; }
    catch(err){ t.disabled=false; msg.textContent = err&&err.code==='conflict' ? 'Outra pessoa publicou antes. A página vai recarregar com a versão nova.' : 'Não deu para publicar. Verifique se você tem permissão de edição e tente de novo.'; }
  }
});

document.addEventListener('change',e=>{
  const inp=e.target.closest('[data-logo]'); if(!inp||!inp.files||!inp.files[0]) return;
  const id=inp.dataset.logo, f=inp.files[0], fr=new FileReader();
  fr.onload=()=>{const img=new Image();img.onload=()=>{
    const m=320,k=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);
    let url=c.toDataURL('image/webp',.85); if(!url.startsWith('data:image/webp')) url=c.toDataURL('image/png');
    document.getElementById(id).value=url;
    document.getElementById(id+'-pv').innerHTML=`<span class="splogo" style="width:56px;height:56px"><img src="${url}" alt=""></span>`;
  };img.onerror=()=>{document.getElementById(id+'-pv').innerHTML='<span class="note">Não consegui ler essa imagem. Tente um PNG ou JPG.</span>'};img.src=fr.result;};
  fr.readAsDataURL(f);
});
document.addEventListener('click',e=>{const b=e.target.closest('[data-logo-clear]');if(!b)return;const id=b.dataset.logoClear;document.getElementById(id).value='';document.getElementById(id+'-pv').innerHTML='<span class="note">Sem logo</span>';b.remove();});
function buildDoc(state){
  const reset=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
  const head='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>';
  const json=JSON.stringify(state).replace(/</g,'\\u003c');
  const SC='script';
  return head+
    '<title>'+esc(state.clube.nome)+'</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'+
    '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">\n'+
    '<script src="https:\/\/cdnjs.cloudflare.com\/ajax\/libs\/gsap\/3.12.5\/gsap.min.js"><\/script>\n'+'<style id="css">'+document.getElementById('css').textContent+'</style>\n\n<div id="root"></div>\n\n'+
    '<'+SC+' id="state" type="application/json">'+json+'</'+SC+'>\n\n'+
    '<'+SC+' id="app">'+document.getElementById('app').textContent+'</'+SC+'>\n'+
    '</body></html>';
}

render();
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(VIEWS[h]&&h!==tab){tab=h;renderView(true);}});

(async()=>{
  try{
    if(!window.claude||!window.claude.use) return;
    const [user,art]=await Promise.all([window.claude.use('user'),window.claude.use('artifact')]);
    if(art && user && await user.canEdit()){artifactApi=art;canEdit=true;render();}
  }catch(e){}
})();
})();
</script>
